<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PurelyJid Staff</title><link rel="stylesheet" href="style.css"><style>.panel{max-width:1200px;margin:auto;padding:35px 20px}.box{background:#fffefa;border:1px solid #dedfd5;padding:24px;border-radius:8px;margin:20px 0}input,textarea,select{padding:10px;border:1px solid #ddd;border-radius:4px}table{width:100%;border-collapse:collapse;font-size:12px}td,th{text-align:left;padding:12px 8px;border-bottom:1px solid #ddd}label{display:block;margin:12px 0;font-size:12px}label input,label select{display:block;width:100%;margin-top:7px}.actions{flex-wrap:wrap;display:flex;gap:12px;align-items:center}.fields{display:grid;grid-template-columns:1fr 1fr;gap:0 15px}.table-wrap{overflow:auto}.order{border-bottom:1px solid #ddd;padding:20px 0;line-height:1.8}#message{color:#953c28}.product-edit{max-width:650px}.primary{width:auto}.login{max-width:420px}button{min-height:32px}@media(max-width:600px){.fields{grid-template-columns:1fr}.panel{padding:20px 15px}}</style></head><body><header><a class="brand" href="/"><strong>PurelyJid.</strong></a><span>Store administration</span><button id="logout" class="bag" hidden>Sign out</button></header><main class="panel"><p id="message" role="status"></p><form id="login" class="box login"><h2>Staff sign in</h2><p class="muted">Use your authorized Supabase account.</p><label>Email<input name="email" type="email" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button class="primary">Sign in</button></form><section id="workspace" hidden><div class="actions"><button class="add" id="products-tab">Products & stock</button><button class="add" id="orders-tab">Orders</button><button class="add" id="import-tab">Import current stock from Excel</button><button class="add" id="new-product">+ New product</button></div><div id="view" class="box"></div></section></main><dialog id="edit" class="product-edit"><button class="close" aria-label="Close editor" id="close-edit">×</button><h2>Product details</h2><form id="product-form"><div class="fields"><label>Name<input name="name" required maxlength="180"></label><label>Category<select name="category" required></select></label><label>Price ₹<input name="price" type="number" step="0.01" min="0" required></label><label>Stock (blank = untracked)<input name="stock" type="number" step="1" min="0"></label><label>Item code<input name="code" maxlength="100"></label><label>Unit<input name="unit" maxlength="40" required value="item"></label></div><label>Image HTTPS URL<input name="image" type="url" maxlength="2000"></label><label><input name="available" type="checkbox"> Available to order</label><label><input name="active" type="checkbox"> Visible on storefront</label><p id="edit-error" role="alert"></p><button class="primary">Save product</button></form></dialog><script src="admin.js"></script></body></html>
